- title: "Agentic campaign control for high-throughput de novo binder design"
  short: T-REX
  authors: [Minkyu Jeon, Jinyeop Song, Jina Kim, Ellen D. Zhong]
  venue: bioRxiv 2026
  year: 2026
  topic: protein
  selected: true
  image: /assets/img/pubs/trex.jpg
  summary: >-
    LLM agents orchestrate protein generative models and structure evaluators under a fixed
    GPU budget, achieving the highest throughput of structurally distinct in-silico binder hits
    on all seven benchmark targets under matched worker-GPU budgets.
  links:
    - {name: Paper, url: "https://www.biorxiv.org/content/10.64898/2026.09.22.753604v2"}
    - {name: Code, url: "https://github.com/ml-struct-bio/T-REX"}

