# Site settings
# Content lives in _data/ (publications.yml, news.yml) and the page templates
# (index.html, publications.html, cv.html). Built by .github/workflows/deploy.yml.

title: Minkyu Jeon
tagline: Agentic AI for protein design and cryo-EM
description: >-
  Ph.D. candidate in Computer Science at Princeton University working on agentic AI for
  de novo protein design and heterogeneous cryo-EM reconstruction.
url: https://minkyujeon.github.io
lang: en

author:
  name: Minkyu Jeon
  email: mj7341@princeton.edu

nav:
  - {title: Home, url: /}
  - {title: Publications, url: /publications/}
  - {title: CV, url: /cv/}
  - {title: Projects, url: /projects/}

profile_links:
  - {name: Email, url: "mailto:mj7341@princeton.edu"}
  - {name: CV, url: /cv/}
  - {name: Google Scholar, url: "https://scholar.google.com/citations?hl=en&user=kyQR6ecAAAAJ"}
  - {name: GitHub, url: "https://github.com/minkyujeon"}
  - {name: LinkedIn, url: "https://www.linkedin.com/in/minkyu-jeon-9a5b92152/"}
  - {name: X, url: "https://x.com/MinkyuJeon19791"}

# jekyll-seo-tag
logo: /assets/img/profile.jpg
twitter:
  username: MinkyuJeon19791
  card: summary
social:
  name: Minkyu Jeon
  links:
    - https://x.com/MinkyuJeon19791
    - https://www.linkedin.com/in/minkyu-jeon-9a5b92152/
    - https://scholar.google.com/citations?hl=en&user=kyQR6ecAAAAJ
    - https://github.com/minkyujeon

plugins:
  - jekyll-seo-tag
  - jekyll-sitemap

# Default social-preview image (og:image / twitter:image) for every page
defaults:
  - scope: {path: ""}
    values:
      image: /assets/img/profile.jpg

# Template leftovers and build by-products stay in the repository but are not published.
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - vendor
  - .jekyll-cache
  - .sass-cache
  - "core.*"
  - images
  - "data/*.bib"
  - "data/*.bst"
  - "data/*_reviews.txt"
  - "data/JonBarron-*"
  - "data/*.tex"
  - "data/*.aux"
  - "data/*.log"
  - "data/*.out"
  - "data/Minkyu_CV_*.pdf"
